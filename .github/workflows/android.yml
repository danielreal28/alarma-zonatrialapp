name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up NodeJS 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android
          # Instalamos el plugin especializado para bucles y alarmas reales
          npm install capacitor-plugin-alarm-manager

      - name: Crear e Inicializar Proyecto Nativo Real
        run: |
          npx cap init "Alarma ZonaTrial" "com.zonatrialapp.alarma" --web-dir=www
          npx cap add android

      - name: Inyectar Tonos en la Carpeta de Recursos
        run: |
          mkdir -p android/app/src/main/res/raw
          cd www
          count=1
          for f in *.[mM][pP]3; do
            if [ -f "$f" ] && [ $count -le 10 ]; then
              cp "$f" "../android/app/src/main/res/raw/alarma$count.mp3"
              count=$((count+1))
            fi
          done
          cd ..

      - name: Configurar Permisos y Servicios de Alarma Reales
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          # 1. Inyectar los permisos necesarios para servicios en segundo plano y alarmas continuas
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.TURN_SCREEN_ON" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />' $MANIFEST_PATH

      - name: Forzar Sincronización Completa
        run: npx cap sync android

      - name: Dar Permisos al Compilador
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-Multipistas-DanielReal
          path: android/app/build/outputs/apk/debug/app-debug.apk
