name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up NodeJS 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications

      - name: Crear e Inicializar Proyecto Nativo Real
        run: |
          npx cap init "Alarma ZonaTrial" "com.zonatrialapp.alarma" --web-dir=www
          npx cap add android

      - name: Inyectar los 10 Tonos Forzando Minúsculas
        run: |
          mkdir -p android/app/src/main/res/raw
          cd www
          for f in *.[mM][pP]3; do
            if [ -f "$f" ]; then
              # Convierte el nombre a minúsculas completas para cumplir la regla de Android
              filename=$(echo "$f" | tr '[:upper:]' '[:lower:]')
              cp "$f" "../android/app/src/main/res/raw/$filename"
            fi
          done
          cd ..

      - name: Forzar Sincronización Completa
        run: npx cap sync android

      - name: Dar Permisos al Compilador
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-Multipistas-DanielReal
          path: android/app/build/outputs/apk/debug/app-debug.apk
