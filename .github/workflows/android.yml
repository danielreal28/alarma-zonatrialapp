name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up NodeJS 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications

      - name: Crear e Inicializar Proyecto Nativo Real
        run: |
          npx cap init "Alarma ZonaTrial" "com.zonatrialapp.alarma" --web-dir=www
          npx cap add android

      - name: Inyectar Tonos y Forzar Categoría de Alarma
        run: |
          mkdir -p android/app/src/main/res/raw
          cd www
          count=1
          for f in *.[mM][pP]3; do
            if [ -f "$f" ] && [ $count -le 10 ]; then
              cp "$f" "../android/app/src/main/res/raw/alarma$count.mp3"
              count=$((count+1))
            fi
          done
          cd ..

      - name: Inyectar Permisos de Alarma Crítica en AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          # Agrega permisos para bypass de silencio, alertas de pantalla completa y vibración infinita
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.TURN_SCREEN_ON" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST_PATH

      - name: Configurar Actividad Principal para Saltar Bloqueo Nativamente
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/zonatrialapp/alarma/MainActivity.java"
          cat << 'EOF' > $MAIN_ACTIVITY
          package com.zonatrialapp.alarma;

          import android.os.Bundle;
          import android.os.Build;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Forzar la prioridad de despliegue sobre el Lockscreen de Android
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);
                  }
              }
          }
          EOF

      - name: Forzar Sincronización Completa
        run: npx cap sync android

      - name: Dar Permisos al Compilador
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-Multipistas-DanielReal
          path: android/app/build/outputs/apk/debug/app-debug.apk
