name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up NodeJS 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependencias del Proyecto
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications

      - name: Crear e Inicializar Proyecto Nativo Real
        run: |
          npx cap init "Alarma ZonaTrial" "com.zonatrialapp.alarma" --web-dir=www
          npx cap add android

      - name: Inyectar y Corregir Nombres de Audios a la Fuerza
        run: |
          mkdir -p android/app/src/main/res/raw
          cd www
          
          # Buscamos CUALQUIER archivo de audio sin importar cómo esté escrito
          count=1
          for f in *.[mM][pP]3; do
            if [ -f "$f" ] && [ $count -le 10 ]; then
              # Forzamos que se guarde como alarma1.mp3, alarma2.mp3... solucionando errores de letras faltantes o mayúsculas
              cp "$f" "../android/app/src/main/res/raw/alarma$count.mp3"
              echo "Corregido e Inyectado: $f -> alarma$count.mp3"
              count=$((count+1))
            fi
          done
          cd ..

      - name: Inyectar Permisos Críticos en AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST_PATH

      - name: Forzar Sincronización Completa
        run: npx cap sync android

      - name: Dar Permisos al Compilador
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarma-Multipistas-DanielReal
          path: android/app/build/outputs/apk/debug/app-debug.apk
